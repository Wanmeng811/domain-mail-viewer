name = "domain-mail-viewer"
main = "src/worker.js"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

# NOTE: this file intentionally keeps placeholders. scripts/deploy.js generates a
# concrete wrangler.deploy.toml with real values and deploys that (wrangler does
# NOT substitute ${...} placeholders in this file).

# ---- D1 database (stores received emails) ----
[[d1_databases]]
binding = "DB"
database_name = "domain-mail-viewer"
database_id = "REPLACE_WITH_D1_ID"

# ---- Static frontend served from ./public ----
[assets]
directory = "public"
not_found_handling = "single-page-application"

# ---- Non-secret variables ----
[vars]
CF_ACCESS_AUTH_DOMAIN = "https://REPLACE.cloudflareaccess.com"
APP_DOMAIN = "mail.example.com"

# ---- Secrets (set automatically by scripts/deploy.js) ----
# CF_ACCESS_AUD = the Audience (AUD) value from your Access application.
