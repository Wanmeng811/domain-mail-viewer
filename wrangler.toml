name = "domain-mail-viewer"
main = "src/worker.js"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

# ---- D1 database (stores received emails) ----
# database_id is injected at deploy time via the env var D1_DATABASE_ID
# (see scripts/deploy.js). Leave the placeholder; do not hardcode.
[[d1_databases]]
binding = "DB"
database_name = "domain-mail-viewer"
database_id = "${D1_DATABASE_ID}"

# ---- Static frontend served from ./public ----
[assets]
directory = "public"
not_found_handling = "single-page-application"

# ---- Non-secret variables (generic; injected at deploy time) ----
[vars]
# Your Cloudflare Access team domain, e.g. https://team.cloudflareaccess.com
CF_ACCESS_AUTH_DOMAIN = "${CF_ACCESS_AUTH_DOMAIN}"
# The hostname this app is served on (display only), e.g. mail.example.com
APP_DOMAIN = "${APP_DOMAIN}"

# ---- Secrets (set automatically by scripts/deploy.js) ----
# CF_ACCESS_AUD = the Audience (AUD) value from your Access application.
